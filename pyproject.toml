[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queryplan"
version = "0.1.0"
description = "Run a fixed set of LLM queries on local GPUs in the order and placement that finishes soonest"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/queryplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
